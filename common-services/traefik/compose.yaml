services:
  traefik:
    image: traefik:v3.6
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--entrypoints.web.address=:80"
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      integration_demo_net:
        aliases:
          - api.integration-demo.local
    labels:
      - "traefik.docker.network=integration_demo_net"

networks:
  integration_demo_net:
    external: true
